  async function publishNow(){if(publishing)return;publishing=true;
    try{sessionStorage.setItem('mc-tab',curPage())}catch(e){}
    try{await art.publish(buildDoc(snapshot()));setStatus('保存しました')}
    catch(e){const c=e&&e.code;if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'){artOK=false;setStatus('この端末のみ保存（共有保存は不可）')}
      else if(c==='conflict'){setStatus('他の端末が更新中')}else{setStatus('共有保存に失敗（端末には保存済み）')}}
    finally{publishing=false}}
  function load(){let d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
    const src=(d&&d.items&&(d.ts||0)>(ST.ts||0))?d:ST;
    state.items=(src.items||[]).map(i=>({...i}));state.orders=src.orders||[];state.sup=src.sup||state.sup;state.ts=src.ts||0}

  function groupBy(arr,key){const m={};arr.forEach(x=>{(m[x[key]||'その他']=m[x[key]||'その他']||[]).push(x)});return m}
  function renderStock(){
    const el=$('#stockList');
    if(!state.items.length){el.innerHTML='<div class="empty">品目がまだありません。「品目」タブから追加してください。</div>';return}
    const g=groupBy(state.items,'cat');let h='';
    for(const cat of Object.keys(g)){
      h+=`<div class="cat">${esc(cat)}</div>`;
      for(const it of g[cat]){const s=suggest(it),q=orderQty(it);
        h+=`<div class="row" data-id="${it.id}">
          <div><div class="nm">${esc(it.name)}</div><div class="meta">基準 ${it.par}${esc(it.unit)} ／ ロット ${it.lot}${esc(it.unit)}</div></div>
          <div class="ctl"><button data-a="-">−</button><input type="number" inputmode="decimal" step="any" data-f="stock" value="${it.stock??''}" placeholder="0"><button data-a="+">＋</button><span class="u">${esc(it.unit)}</span></div>
          <div class="need ${q>0?'':'ok'}">発注 <b>${q>0?q+esc(it.unit):'不要'}</b><span style="margin-left:auto;color:var(--mute)">手直し</span><input type="number" inputmode="decimal" step="any" data-f="order" value="${it.order??''}" placeholder="${s}"></div>
        </div>`}}
    el.innerHTML=h;
  }
  function buildOrder(){
    const lines=state.items.filter(it=>orderQty(it)>0).map(it=>({id:it.id,name:it.name,qty:orderQty(it),unit:it.unit,cat:it.cat}));
    const d=new Date();const day=`${d.getMonth()+1}/${d.getDate()}`;
    const g=groupBy(lines,'cat');
    let body='';
    if(lines.length){
      body=`${state.sup.name||'ご担当者'}${state.sup.name?'御中':'様'}\n\nお世話になっております。MUNCHEESEです。\n${day}分、下記の通り発注をお願いいたします。\n\n`;
      for(const cat of Object.keys(g)){body+=`■${cat}\n`+g[cat].map(l=>`・${l.name}　${l.qty}${l.unit}`).join('\n')+'\n\n'}
      body+='よろしくお願いいたします。\n\nMUNCHEESE';
    }
    let h='';
    if(!lines.length)h='<div class="empty">発注するものがありません。在庫チェックで数を入れてください。</div>';
    else{
      const subj=encodeURIComponent(`【発注】${day} MUNCHEESE`);
      const mail=state.sup.email?`<a class="btn sm" href="mailto:${esc(state.sup.email)}?subject=${subj}&body=${encodeURIComponent(body)}">メールで送る</a>`:`<button class="btn ghost sm" data-a="setmail">宛先を設定</button>`;
      h=`<div class="sup"><h3><span>${esc(state.sup.name||'発注先未設定')}${state.sup.note?` <small style="color:var(--mute);font-weight:400">${esc(state.sup.note)}</small>`:''}</span>${mail}</h3>`;
      for(const cat of Object.keys(g)){h+=`<div class="cat" style="margin:10px 0 4px">${esc(cat)}</div>`;g[cat].forEach(l=>{h+=`<div class="ln"><span>${esc(l.name)}</span><span><b>${l.qty}</b>${esc(l.unit)}</span></div>`})}
      h+='</div>';
    }
    $('#supList').innerHTML=h;$('#orderText').value=body;
    return {lines,text:body};
  }
  function renderHist(){
    const el=$('#histList');const os=[...state.orders].sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
    if(!os.length){el.innerHTML='<div class="empty">まだ発注履歴がありません。</div>';return}
    el.innerHTML=os.map(o=>`<div class="hist" data-id="${o.id}"><div class="h"><span>${fmtDate(o.createdAt)}　${o.lines.length}品目</span>
      <span class="tag ${o.status==='納品済'?'done':'sent'}">${o.status}</span>
      ${o.status==='発注済'?'<button class="btn ghost sm" data-a="done">納品済にする</button>':''}</div><pre>${esc(o.text)}</pre></div>`).join('');
  }
  function renderItems(){
    const el=$('#itemList');const cats=[...new Set(state.items.map(i=>i.cat).filter(Boolean))];
    $('#cats').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
    const g=groupBy(state.items,'cat');let h='';
    for(const cat of Object.keys(g)){h+=`<div class="cat">${esc(cat)}</div>`;
      h+=g[cat].map(it=>`<div class="item" data-id="${it.id}"><div>${esc(it.name)}<small>基準${it.par}${esc(it.unit)}・ロット${it.lot}${esc(it.unit)}</small></div><div><button data-a="edit">編集</button> <button data-a="del">削除</button></div></div>`).join('')}
    el.innerHTML=h||'<div class="empty">品目がありません。</div>';
  }
  function renderSup(){$('#s-name').value=state.sup.name||'';$('#s-email').value=state.sup.email||'';$('#s-note').value=state.sup.note||''}
  function renderAll(){renderStock();buildOrder();renderHist();renderItems();renderSup()}

  document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.p)});
  function show(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id==='p-'+p));
    const bar=$('#bar');
    if(p==='stock'){bar.style.display='flex';$('#btnReset').textContent='発注数クリア';$('#btnGo').textContent='発注書を見る'}
    else if(p==='order'){bar.style.display='flex';$('#btnReset').textContent='コピー';$('#btnGo').textContent='発注済みにする';buildOrder()}
    else bar.style.display='none';
    window.scrollTo(0,0)}
  const curPage=()=>document.querySelector('nav button.on').dataset.p;

  $('#stockList').addEventListener('input',e=>{const row=e.target.closest('.row');if(!row)return;const it=state.items.find(i=>i.id===row.dataset.id);if(!it)return;
    if(e.target.dataset.f==='stock')it.stock=e.target.value===''?null:num(e.target.value);
    if(e.target.dataset.f==='order')it.order=e.target.value===''?null:num(e.target.value);
    save();updateRow(row,it)});
  $('#stockList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('.row');const it=state.items.find(i=>i.id===row.dataset.id);
    const step=it.lot>=1?1:(it.lot||0.5);it.stock=Math.max(0,num(it.stock)+(b.dataset.a==='+'?step:-step));it.stock=Math.round(it.stock*100)/100;
    row.querySelector('[data-f=stock]').value=it.stock;save();updateRow(row,it)});
  function updateRow(row,it){const q=orderQty(it),n=row.querySelector('.need');n.classList.toggle('ok',q<=0);n.querySelector('b').textContent=q>0?q+it.unit:'不要';n.querySelector('[data-f=order]').placeholder=suggest(it)}

  async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch(e){const ta=$('#orderText');ta.select();document.execCommand('copy');toast('コピーしました')}}
  $('#supList').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.a==='setmail'){show('sup');$('#s-email').focus()}});

  $('#btnGo').addEventListener('click',async()=>{
    if(curPage()==='stock'){show('order');return}
    const o=buildOrder();if(!o.lines.length){toast('発注するものがありません');return}
    if(!await ask('送信は済みましたか？履歴に保存して発注数をリセットします。','保存する'))return;
    state.orders.unshift({id:uid(),createdAt:new Date().toISOString(),status:'発注済',lines:o.lines,text:o.text});if(state.orders.length>60)state.orders.length=60;
    state.items.forEach(it=>{if(orderQty(it)>0)it.order=0});
    save();renderAll();toast('履歴に保存しました');show('hist');
  });
  $('#btnReset').addEventListener('click',async()=>{
    if(curPage()==='stock'){if(!await ask('全品目の発注数（手直し）を消しますか？','消す'))return;state.items.forEach(it=>{it.order=null});save();renderStock();buildOrder();return}
    const t=$('#orderText').value;if(!t){toast('発注するものがありません');return}copyText(t);
  });
  $('#histList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const o=state.orders.find(x=>x.id===b.closest('.hist').dataset.id);o.status='納品済';save();renderHist()});

  $('#f-save').addEventListener('click',()=>{
    const name=$('#f-name').value.trim();if(!name){toast('品名を入れてください');return}
    const editing=$('#f-id').value;const id=editing||uid();let it=state.items.find(i=>i.id===id);
    const d={id,name,cat:$('#f-cat').value.trim()||'その他',unit:$('#f-unit').value.trim()||'個',par:num($('#f-par').value),lot:num($('#f-lot').value)||1};
    if(it)Object.assign(it,d);else{it={...d,stock:null,order:null};state.items.push(it)}
    save();clearForm();renderAll();toast(editing?'更新しました':'追加しました')});
  function clearForm(){['name','cat','unit','par','lot','id'].forEach(k=>$('#f-'+k).value='');$('#f-save').textContent='追加する'}
  $('#itemList').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const it=state.items.find(i=>i.id===b.closest('.item').dataset.id);
    if(b.dataset.a==='del'){if(!await ask(`「${it.name}」を削除しますか？`,'削除する'))return;state.items=state.items.filter(i=>i!==it);save();renderAll();return}
    $('#f-id').value=it.id;$('#f-name').value=it.name;$('#f-cat').value=it.cat;$('#f-unit').value=it.unit;$('#f-par').value=it.par;$('#f-lot').value=it.lot;$('#f-save').textContent='更新する';window.scrollTo(0,0)});
  $('#s-save').addEventListener('click',()=>{state.sup={name:$('#s-name').value.trim(),email:$('#s-email').value.trim(),note:$('#s-note').value.trim()};save();buildOrder();toast('保存しました')});

  $('#c-url').value=cloudUrl;
  $('#c-save').addEventListener('click',async()=>{const u=$('#c-url').value.trim();if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){toast('URLの形式が違います（…/exec で終わるもの）');return}
    cloudUrl=u;try{localStorage.setItem(CK,u)}catch(e){}if(!u){setStatus('保存済み');toast('クラウド保存をオフにしました');return}
    toast('接続を確認しています…');await cloudPull();if(cloudUrl)cloudPush()});
  $('#bk-copy').addEventListener('click',()=>copyText(JSON.stringify(snapshot())));
  $('#bk-load').addEventListener('click',async()=>{let d;try{d=JSON.parse($('#bk-text').value.trim())}catch(e){toast('バックアップの形式が違います');return}
    if(!d||!Array.isArray(d.items)){toast('バックアップの形式が違います');return}
    if(!await ask('今のデータをバックアップの内容で置き換えますか？','置き換える'))return;
    state.items=d.items;state.orders=d.orders||[];state.sup=d.sup||state.sup;save();$('#bk-text').value='';renderAll();toast('読み込みました')});
  load();renderAll();let t0='stock';try{t0=sessionStorage.getItem('mc-tab')||'stock';sessionStorage.removeItem('mc-tab')}catch(e){}show(t0);cloudPull();
  (async()=>{return;try{art=await window.claude.use('artifact')}catch(e){art=null}
    if(art){artOK=true;setStatus('共有保存オン')}})();
})();
</script></body></html>
